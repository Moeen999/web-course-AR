<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe HTML</title>
  </head>
  <body>
    <h1>Webpages Embedding</h1>
    <p>
      iframe tag is used to embed or add the other webpages into our websites
    </p>
    <a href="https://youtu.be/w_Rf63q3GSI?list=RDw_Rf63q3GSI"
      >Noor Jahan Songs</a
    >
    <iframe
      width="500"
      height="500"
      src="https://www.youtube.com/embed/w_Rf63q3GSI?list=RDw_Rf63q3GSI"
      title="Main Tere Sang Kaise"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe
      src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d55628.87536441005!2d71.65130530213311!3d29.37600681457955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sbahawalpur%20commercial%20area!5e0!3m2!1sen!2s!4v1786950332834!5m2!1sen!2s"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <img
      src="https://images.unsplash.com/photo-1786813717563-6a7da575d44d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1fHx8ZW58MHx8fHx8"
      alt="Pinterest Image"
    />
    <img src="/public/image1.png" alt="" />

    <!-- &#128514; -->
     
  </body>
</html>
