<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin & Padding</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        width: 300px;
        height: 300px;
        border: 1px solid black;
        margin: 200px;
    }
     .container2{
        width: 300px;
        height: 300px;
        border: 1px solid black;
        background-color: aqua;
        padding: 50px;
    }
    .sub-container{
        width: 50%;
        height: 50%;
        background-color: white;
        color: black;
        /* padding: 10px 10px 20px 20px; */
        padding-top: 10px;
        padding-right: 10px;
        padding-bottom: 20px;
        padding-left: 20px;
    }
</style>
<body>

    <!-- <div class="container">
        <h1>Margin</h1>
    </div> -->


    <div class="container2">
        <div class="sub-container"><span>Padding</span></div>
    </div>
    
</body>
</html>
