<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property CSS</title>
</head>

<style>

    /* adding style to the list items to inline so that we may create a hoorizontal menu items */
    /* li{ */
        /* display: inline; */
        /* display: none; */
        /* padding: 0.5rem;
        border: 1px solid black;
        outline: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: salmon;
        color: white;
        cursor: pointer;
    } */

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        width: 100%;
        height: 100vh;
    }
    .nav-container{
        width: 100%;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        padding: 0.5rem 1rem;
        background-color: salmon;
    }

    .logo{
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
    }

    .navigation-links ul{
        display: flex;
        gap: 1rem;
    }

    .navigation-links ul li{
        list-style-type: none;
        padding: 0.5rem;
        outline: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        color: white;
        cursor: pointer;
    }

    .action-buttons{
        display: flex;
        gap: 1rem;
    }

    .action-buttons button{
        padding: 0.5rem;
        border: 1px solid black;
        outline: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: salmon;
        color: white;
        cursor: pointer;
    }

</style>
<body>


    <div class="nav-container">
        <div class="logo">
            M. Raouf
        </div>
        <div class="navigation-links">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </div>
        <div class="action-buttons">
            <button class="btn">Login</button>
            <button class="btn">Sign Up</button>
        </div>
    </div>
    
</body>
</html>
