    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
    }
    body {
      height: 100dvh;
      width: 100vw;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      background-color: rgba(0, 0, 0, 0.181);
      padding: 2rem;
    }
    nav a {
      text-decoration: none;
      color: indianred;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 0;
      height: 2px;
      background-color: indianred;
      transition: transform 0.25s ease-in-out;
    }

    nav a:hover::after {
      /* transition: move 0.9s ease-in-out; */
      width: 100%;
    }
  </style>
