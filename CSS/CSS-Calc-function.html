  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #181818;
      overflow: hidden;

    }

    /* Hacker like viewport container styling using calc() */

    .box-container {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      background-color: #181818;
    }

    .box-container::before{
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(#181818,#0f0,#181818);
        animation: animate 2s linear infinite;
    }
    @keyframes animate{
        0%{
            transform: translateY(-100%);
        }
        100%{
            transform: translateY(100%);
        }
    }

    .box-container span {
        position: relative;
        width: calc(6.25vw - 2px);     
        height: calc(6.25vw - 2px);
        transition: 0.4s;  
        background-color: #181818;
        z-index: 99;
    }

    .box-container span:hover {
        transition: 0s;
        background-color: #0f0;
    }

  </style>
